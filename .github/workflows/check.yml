name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Throwaway database; no model key, live mode off. CI never makes paid calls.
      DATABASE_PATH: /tmp/klinikaflow-ci.sqlite
      ALLOW_LIVE_MODE: "false"
      MODEL_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run eval
